services:
  db:
    image: postgres:16-alpine
    container_name: fiyat-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fiyat
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fiyat"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    container_name: fiyat-web
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/fiyat
      NODE_ENV: production
      PORT: "3001"
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
